##### Prefix (Leader)
unbind C-b
set-option -g prefix C-s
bind C-s send-prefix

##### Disable status bar (closest equivalent to hiding WezTerm tab bar)
set -g status off

##### Pane splitting
bind % split-window -v
bind '"' split-window -h

##### Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

##### Copy mode
bind v copy-mode

##### Scroll one line
bind -n S-Up if-shell -F '#{pane_in_mode}' \
    'send-keys -X scroll-up' \
    'copy-mode; send-keys -X scroll-up'

bind -n S-Down if-shell -F '#{pane_in_mode}' \
    'send-keys -X scroll-down' \
    'send-keys -X scroll-down'

##### Ctrl+h/j/k/l passthrough
# (You only used Ctrl+j and Ctrl+k in WezTerm)
bind -n C-k send-keys Up
bind -n C-j send-keys Down

##### Faster escape
set -sg escape-time 0
set -g mode-keys vi
set -g set-clipboard on

bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"

##### Mouse support (optional)
set -g mouse on
