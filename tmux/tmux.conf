##### Prefix (Leader) — Ctrl+s, matching WezTerm's leader
unbind C-b
set -g prefix C-s
bind C-s send-prefix

##### No status bar (WezTerm: enable_tab_bar = false)
set -g status off

##### Pane splitting — match WezTerm's SplitVertical / SplitHorizontal
# % -> new pane below (WezTerm SplitVertical)
# " -> new pane to the right (WezTerm SplitHorizontal)
bind % split-window -v -c "#{pane_current_path}"
bind '"' split-window -h -c "#{pane_current_path}"

##### Vim-style pane navigation (leader h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

##### Copy mode (leader v)
bind v copy-mode -e

##### Shift+Up/Down: scroll one line (WezTerm ScrollByLine)
# Root bindings do not fire while a pane is in copy mode, so the keys must
# also be bound in the copy-mode-vi table. S-Up enters copy mode first.
bind -n S-Up copy-mode -e \; send-keys -X scroll-up
bind -T copy-mode-vi S-Up send-keys -X scroll-up
bind -T copy-mode-vi S-Down send-keys -X scroll-down

##### Ctrl+j / Ctrl+k -> Down / Up (WezTerm SendKey)
bind -n C-j send-keys Down
bind -n C-k send-keys Up
bind -T copy-mode-vi C-j send-keys -X cursor-down
bind -T copy-mode-vi C-k send-keys -X cursor-up

##### Ctrl+Delete -> Alt+d (WezTerm linux mapping)
# Ctrl+Backspace -> Ctrl+w is deliberately not bound here: tmux reports a
# plain Backspace (0x7f) as C-BSpace, so binding it would break Backspace.
# WezTerm already handles Ctrl+Backspace at the terminal level.
bind -n C-Delete send-keys M-d

##### Copy mode behaviour
set -g mode-keys vi
set -sg escape-time 0
set -g set-clipboard on

# v: start a character-wise selection (tmux's default v is rectangle-toggle;
# Space also starts a selection). Move with h/j/k/l, then y to copy and exit.
bind -T copy-mode-vi v send-keys -X begin-selection

# Copy to the system clipboard (Wayland, then X11 fallbacks)
# y: copy selection and exit
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -selection clipboard -in 2>/dev/null || xsel --clipboard --input 2>/dev/null"

# Escape exits copy mode, like WezTerm
bind -T copy-mode-vi Escape send-keys -X cancel

##### Mouse support
set -g mouse on

# Keep the selection highlighted after the mouse button is released.
# tmux clears the highlight when it copies, so do not copy on release:
# drag/double-click/triple-click to select, then y to copy and exit.
# Escape (or q) cancels.  If WezTerm handles the mouse natively (see
# .wezterm.lua), this path is bypassed and release copies immediately.
bind -T copy-mode-vi MouseDragEnd1Pane run-shell "true"
bind -T root DoubleClick1Pane select-pane -t = \; if-shell -F -t = '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -H ; send-keys -X select-word }
bind -T root TripleClick1Pane select-pane -t = \; if-shell -F -t = '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -H ; send-keys -X select-line }
